services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vttg_systems
      POSTGRES_USER: vttg_systems
      POSTGRES_PASSWORD: vttg_systems
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vttg_systems -d vttg_systems"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vttg-systems-postgres:/var/lib/postgresql/data

volumes:
  vttg-systems-postgres:
